# Settings for the Lychee link checker used in CI.

# Treat "too many requests" as fine, some sites rate-limit robots.
accept = ["200..=299", "403", "429"]

max_retries = 3
timeout = 20

exclude = [
  "^mailto:",
  "^tel:",
  "example\\.com",
  # Broken on purpose in lesson 06, to show how alt text works.
  "photo-not-found\\.jpg",
  # Preconnect hints, not real pages.
  "^https://fonts\\.gstatic\\.com/?$",
  "^https://fonts\\.googleapis\\.com/?$",
  # Our own Pages URL does not exist until the first deploy.
  "mohammedfahd\\.github\\.io",
]

exclude_path = ["node_modules"]
